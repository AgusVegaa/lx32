[package]
name        = "lx32-rust-firmware-tests"
version     = "0.1.0"
edition     = "2021"
description = "Bare-metal Rust firmware tests for the LX32K keyboard processor"
publish     = false

[[bin]]
name = "01_return42"
path = "src/bin/01_return42.rs"

[[bin]]
name = "02_pointer_store"
path = "src/bin/02_pointer_store.rs"

[[bin]]
name = "03_call_chain"
path = "src/bin/03_call_chain.rs"

[[bin]]
name = "04_branch_loop"
path = "src/bin/04_branch_loop.rs"

[[bin]]
name = "05_compare_assign"
path = "src/bin/05_compare_assign.rs"

[[bin]]
name = "06_pointer_walk"
path = "src/bin/06_pointer_walk.rs"

[[bin]]
name = "07_fibonacci_iter"
path = "src/bin/07_fibonacci_iter.rs"

[[bin]]
name = "08_fibonacci_recursive"
path = "src/bin/08_fibonacci_recursive.rs"

[[bin]]
name = "09_custom_intrinsics"
path = "src/bin/09_custom_intrinsics.rs"

[[bin]]
name = "10_mul_softcall"
path = "src/bin/10_mul_softcall.rs"

[[bin]]
name = "11_global_array"
path = "src/bin/11_global_array.rs"

[[bin]]
name = "12_bitops_shift"
path = "src/bin/12_bitops_shift.rs"

[[bin]]
name = "13_nested_loop"
path = "src/bin/13_nested_loop.rs"

[[bin]]
name = "14_classify_fn"
path = "src/bin/14_classify_fn.rs"

[[bin]]
name = "15_multi_args"
path = "src/bin/15_multi_args.rs"

[[bin]]
name = "16_indirect_call"
path = "src/bin/16_indirect_call.rs"

[[bin]]
name = "17_volatile_mmio"
path = "src/bin/17_volatile_mmio.rs"

[[bin]]
name = "18_sign_extend"
path = "src/bin/18_sign_extend.rs"

[[bin]]
name = "19_reg_pressure"
path = "src/bin/19_reg_pressure.rs"

[[bin]]
name = "20_shift_mix"
path = "src/bin/20_shift_mix.rs"

[[bin]]
name = "21_div_mod_softcall"
path = "src/bin/21_div_mod_softcall.rs"

[profile.release]
opt-level     = "z"
lto           = true
panic         = "abort"
codegen-units = 1
strip         = "debuginfo"

[profile.dev]
panic     = "abort"
opt-level = 1
